name: ChatGPT targeted configuration cleanup

on:
  push:
    branches:
      - agent/spark-executor-cleanup
    paths:
      - .github/workflows/chatgpt-config-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spark-executor-cleanup

      - name: Apply targeted edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # -------------------------------------------------
          # ComparisonBuilder: no first-column/default key,
          # preserve every valid configured comparison key,
          # send every configured key, and keep strategy
          # thresholds server-configured instead of UI-coded.
          # -------------------------------------------------
          path = "frontend/src/features/comparisons/ComparisonBuilder.jsx"
          replace(
              path,
              'import { defaultMappedPair, findSchemaColumn, getColumnType, getSchemaColumnNames, isNumericColumn, isNumericMapping, rowsEqual } from "../../utils/schema";',
              'import { findSchemaColumn, getColumnType, getSchemaColumnNames, isNumericColumn, isNumericMapping, rowsEqual } from "../../utils/schema";',
          )
          replace(
              path,
              '''      const next = validPairs.length\n        ? [validPairs[0]]\n        : [defaultMappedPair(sourceSchema, targetSchema)];''',
              '''      const next = validPairs.length\n        ? validPairs\n        : [{ source_column: "", target_column: "" }];''',
          )
          replace(
              path,
              '''    const comparisonKeyPayload = (comparisonKeys || [])\n      .slice(0, 1)\n      .filter((key) => key.source_column && key.target_column)''',
              '''    const comparisonKeyPayload = (comparisonKeys || [])\n      .filter((key) => key.source_column && key.target_column)''',
          )
          replace(
              path,
              '''      strategy_policy: {\n        max_exact_rows: 100000,\n        max_exact_bytes: 50000000,\n        sampling_min_rows: 1000000,\n        allow_sampling: false,\n      },\n''',
              '',
          )

          # -------------------------------------------------
          # Results: never guess keys from id/name/email or
          # the first record column. Use explicit business_key
          # or explicit reconciliation key supplied by backend.
          # -------------------------------------------------
          path = "frontend/src/features/results/Results.jsx"
          replace(
              path,
              '''function getRecordKey(r) {\n  if (r.key) {''',
              '''function getRecordKey(r) {\n  if (r.business_key !== undefined && r.business_key !== null) return r.business_key;\n  if (r.key) {''',
          )
          replace(
              path,
              '''  const rec = r.record || r.source_record || r.target_record || (r.source_records ? r.source_records[0] : null) || (r.target_records ? r.target_records[0] : null);\n  if (!rec) return r.key || r.signature || r.record_key || r.id || "N/A";\n  const keys = ["id", "key", "ID", "Key", "uid", "uuid", "name", "Name", "email", "Email", "customer_id", "Customer_ID"];\n  for (let k of keys) {\n    if (rec[k] !== undefined) return rec[k];\n  }\n  return r.key || r.signature || r.record_key || Object.values(rec)[0] || "N/A";''',
              '''  return r.business_key ?? r.key ?? r.signature ?? r.record_key ?? "N/A";''',
          )
          replace(
              path,
              '''          key: "record", label: "Record Key", render: r => {\n            if (!r.record) return "Row Data";\n            const keys = ["id", "key", "ID", "Key", "uid", "uuid", "name", "Name", "email", "Email", "customer_id", "Customer_ID"];\n            for (let k of keys) {\n              if (r.record[k] !== undefined) return <CopyableKey text={r.record[k]} />;\n            }\n            return <CopyableKey text={Object.values(r.record)[0] || "Row Data"} />;\n          }''',
              '''          key: "business_key", label: "Business Key", render: r => (\n            <CopyableKey text={r.business_key ?? "Not available"} />\n          )''',
          )

          # -------------------------------------------------
          # Strategy policy: defaults are runtime ENV values.
          # -------------------------------------------------
          path = "app/domain/context.py"
          replace(path, 'from typing import Any\nimport re\n', 'from typing import Any\nimport os\nimport re\n')
          replace(
              path,
              '''class StrategyPolicy(BaseModel):\n    max_exact_rows: int\n    max_exact_bytes: int\n    sampling_min_rows: int\n    allow_sampling: bool = False''',
              '''class StrategyPolicy(BaseModel):\n    max_exact_rows: int = Field(default_factory=lambda: int(os.getenv("STRATEGY_MAX_EXACT_ROWS", "100000")))\n    max_exact_bytes: int = Field(default_factory=lambda: int(os.getenv("STRATEGY_MAX_EXACT_BYTES", "50000000")))\n    sampling_min_rows: int = Field(default_factory=lambda: int(os.getenv("STRATEGY_SAMPLING_MIN_ROWS", "1000000")))\n    allow_sampling: bool = Field(default_factory=lambda: os.getenv("STRATEGY_ALLOW_SAMPLING", "false").strip().lower() in {"1", "true", "yes", "on"})''',
          )

          path = "app/api/schemas/comparison.py"
          replace(
              path,
              '    strategy_policy: StrategyPolicy\n',
              '    strategy_policy: StrategyPolicy = Field(default_factory=StrategyPolicy)\n',
          )

          # -------------------------------------------------
          # Execution logical resource scheduling tunables.
          # -------------------------------------------------
          path = "app/execution/engine.py"
          replace(path, 'from datetime import datetime, timezone\nimport logging\n', 'from datetime import datetime, timezone\nimport logging\nimport os\n')
          replace(
              path,
              'logger = logging.getLogger(__name__)\n',
              '''logger = logging.getLogger(__name__)\n\nEXECUTION_MEMORY_CAPACITY_MB = int(os.getenv("EXECUTION_MEMORY_CAPACITY_MB", "4096"))\nEXECUTION_DEFAULT_CPU_UNITS = int(os.getenv("EXECUTION_DEFAULT_CPU_UNITS", "1"))\nEXECUTION_DEFAULT_MEMORY_MB = int(os.getenv("EXECUTION_DEFAULT_MEMORY_MB", "256"))\nEXECUTION_DEFAULT_WORKERS = int(os.getenv("EXECUTION_DEFAULT_WORKERS", "1"))\n''',
          )
          replace(path, '                memory_mb=4096,\n', '                memory_mb=EXECUTION_MEMORY_CAPACITY_MB,\n')
          replace(
              path,
              '''                cpu_units=1,\n                memory_mb=256,\n                workers=1,''',
              '''                cpu_units=EXECUTION_DEFAULT_CPU_UNITS,\n                memory_mb=EXECUTION_DEFAULT_MEMORY_MB,\n                workers=EXECUTION_DEFAULT_WORKERS,''',
          )
          replace(path, '                    "cpu_units",\n                    1,\n', '                    "cpu_units",\n                    EXECUTION_DEFAULT_CPU_UNITS,\n')
          replace(path, '                    "memory_mb",\n                    256,\n', '                    "memory_mb",\n                    EXECUTION_DEFAULT_MEMORY_MB,\n')
          replace(path, '                    "workers",\n                    1,\n', '                    "workers",\n                    EXECUTION_DEFAULT_WORKERS,\n')

          # -------------------------------------------------
          # Docker ENV wiring for all runtime tunables above.
          # -------------------------------------------------
          path = "docker-compose.yml"
          replace(
              path,
              '      DATABASE_URL: postgresql://comparator:${POSTGRES_PASSWORD:-comparator}@postgres:5432/comparator\n\n      SPARK_MASTER_URL:',
              '''      DATABASE_URL: postgresql://comparator:${POSTGRES_PASSWORD:-comparator}@postgres:5432/comparator\n\n      EXECUTION_MEMORY_CAPACITY_MB: ${EXECUTION_MEMORY_CAPACITY_MB:-4096}\n      EXECUTION_DEFAULT_CPU_UNITS: ${EXECUTION_DEFAULT_CPU_UNITS:-1}\n      EXECUTION_DEFAULT_MEMORY_MB: ${EXECUTION_DEFAULT_MEMORY_MB:-256}\n      EXECUTION_DEFAULT_WORKERS: ${EXECUTION_DEFAULT_WORKERS:-1}\n\n      STRATEGY_MAX_EXACT_ROWS: ${STRATEGY_MAX_EXACT_ROWS:-100000}\n      STRATEGY_MAX_EXACT_BYTES: ${STRATEGY_MAX_EXACT_BYTES:-50000000}\n      STRATEGY_SAMPLING_MIN_ROWS: ${STRATEGY_SAMPLING_MIN_ROWS:-1000000}\n      STRATEGY_ALLOW_SAMPLING: ${STRATEGY_ALLOW_SAMPLING:-false}\n\n      SPARK_MASTER_URL:''',
          )

          env_example = Path('.env.example')
          existing = env_example.read_text() if env_example.exists() else ''
          block = '''\n# Comparison strategy\nSTRATEGY_MAX_EXACT_ROWS=100000\nSTRATEGY_MAX_EXACT_BYTES=50000000\nSTRATEGY_SAMPLING_MIN_ROWS=1000000\nSTRATEGY_ALLOW_SAMPLING=false\n\n# Execution scheduler (logical capacity, not Spark executor heap)\nEXECUTION_MEMORY_CAPACITY_MB=4096\nEXECUTION_DEFAULT_CPU_UNITS=1\nEXECUTION_DEFAULT_MEMORY_MB=256\nEXECUTION_DEFAULT_WORKERS=1\n'''
          if 'STRATEGY_MAX_EXACT_ROWS=' not in existing:
              env_example.write_text(existing.rstrip() + '\n' + block.lstrip())

          # Remove this one-time workflow from the resulting commit.
          Path('.github/workflows/chatgpt-config-cleanup.yml').unlink()
          PY

      - name: Verify no targeted hardcoding remains
        shell: bash
        run: |
          ! grep -q 'slice(0, 1)' frontend/src/features/comparisons/ComparisonBuilder.jsx
          ! grep -q 'validPairs\[0\]' frontend/src/features/comparisons/ComparisonBuilder.jsx
          ! grep -q 'Record Key' frontend/src/features/results/Results.jsx
          ! grep -q 'customer_id.*Customer_ID' frontend/src/features/results/Results.jsx
          grep -q 'EXECUTION_MEMORY_CAPACITY_MB' app/execution/engine.py
          grep -q 'STRATEGY_MAX_EXACT_ROWS' app/domain/context.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove hardcoded comparison defaults"
          git push origin HEAD:agent/spark-executor-cleanup
