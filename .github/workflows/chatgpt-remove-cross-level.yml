name: Remove cross-level report analysis
on:
  push:
    branches: [agent/spark-executor-cleanup]
    paths: [.github/workflows/chatgpt-remove-cross-level.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spark-executor-cleanup
      - name: Remove cross-level analysis from L7 report
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/analysis/groq_analyzer.py')
          s = p.read_text()
          old = '''        normalized[\n            "cross_level_analysis"\n        ] = self._normalize_correlations(\n            raw.get("cross_level_analysis"),\n            evidence,\n        )'''
          new = '''        # Cross-level correlation is intentionally omitted from the user-facing\n        # L7 report. L1-L6 remain independent deterministic validations.\n        normalized["cross_level_analysis"] = []'''
          if old not in s:
              raise SystemExit('groq_analyzer cross-level block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/analysis/prompts/l7_report_request.txt')
          s = p.read_text()
          start = s.index('  "cross_level_analysis": [')
          # Remove the comma after key_findings and the complete cross-level JSON member.
          end_marker = '\n  ]\n}\n\nRequirements:'
          end = s.index(end_marker, start) + len('\n  ]')
          s = s[:start] + s[end:]
          s = s.replace('  ],\n\n}\n\nRequirements:', '  ]\n}\n\nRequirements:', 1)
          p.write_text(s)

          p = Path('app/analysis/prompts/l7_system.txt')
          s = p.read_text()
          s = s.replace('- CORRELATION: an observed relationship across validation levels; it does not establish causation.\n', '')
          s = s.replace('\nAnalyze levels together. State clearly whether L2 row-count differences reconcile with L3 missing/extra records, whether L4 numeric differences reconcile with L5 aggregates, and whether the supplied evidence does not establish a relationship. Correlation never proves causation.\n', '\nTreat each L1-L6 validation result on its own evidence. Do not add cross-level reconciliation or correlation sections.\n')
          p.write_text(s)

          # One-time helper only; do not leave CI machinery in the project.
          Path('.github/workflows/chatgpt-remove-cross-level.yml').unlink()
          PY

          python3 -m compileall app/analysis
          grep -q 'normalized\["cross_level_analysis"\] = \[\]' app/analysis/groq_analyzer.py
          ! grep -q '"cross_level_analysis": \[' app/analysis/prompts/l7_report_request.txt
          ! grep -q 'Analyze levels together' app/analysis/prompts/l7_system.txt

          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove cross-level L7 report section'
          git push origin HEAD:agent/spark-executor-cleanup
