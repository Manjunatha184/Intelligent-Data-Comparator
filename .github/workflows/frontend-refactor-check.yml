name: Frontend refactor check

on:
  push:
    branches:
      - agent/refactor-frontend-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-frontend-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate extracted frontend modules
        run: python3 tools/refactor_frontend.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Remove legacy monolith after successful build
        run: rm frontend/src/legacy/MonolithApp.jsx

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "wire verified frontend modules (ChatGPT-assisted)"
          git push origin HEAD:agent/refactor-frontend-ui
