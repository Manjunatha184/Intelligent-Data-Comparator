server {
  listen 80;
  server_name _;

  # CSV connections can be hundreds of MB. The backend streams UploadFile
  # content directly to disk, so allow large request bodies at the proxy edge.
  client_max_body_size 512m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;

    proxy_http_version 1.1;

    # Stream large uploads to FastAPI instead of buffering the complete
    # multipart request inside nginx first.
    proxy_request_buffering off;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
